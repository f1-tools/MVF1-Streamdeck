<!DOCTYPE html>
<html>

<head lang="en">
    <title>Toggle Always On Top</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v3/sdpi-components.js"></script>
</head>

<body>
    <!--
        Learn more about property inspector components at https://sdpi-components.dev/docs/components
    -->
    <sdpi-item label="Info">
        The Toggle Always On Top action will toggle the Always On Top setting for the selected player. This is useful
        after you toggle fullscreen and a player is in the way of your view. Just set the fullscreen player to Always On
        Top and it will be on top of the other players.
    </sdpi-item>
</body>

</html>
